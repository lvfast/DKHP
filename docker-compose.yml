services:
  course-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

